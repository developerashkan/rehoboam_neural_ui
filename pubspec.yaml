name: rehoboam_neural_ui
description: A high-fidelity "Rehoboam" style neural HUD and data-visualization widget for Flutter. Features organic particulate animations and 2D-projected geographic mapping.
version: 0.0.2
homepage: https://github.com/developerashkan/rehoboam_neural_ui
repository: https://github.com/developerashkan/rehoboam_neural_ui

screenshots:
  - description: 'High-fidelity "Rehoboam" style neural HUD with organic particulate animations.'
    path: assets/Screenshot.png
  - description: '3D projected geographic mapping on a 2D rotating globe HUD.'
    path: assets/rehoboam_screen_record.gif

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  dot_globe: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
