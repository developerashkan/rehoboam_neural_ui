name: rehoboam_neural_ui
description: AI-native Flutter UI. Liquid-glass orb, voice and chat widgets, the Rehoboam HUD and 3D globe, plus an agent for Claude, Gemini, OpenAI, Genkit and any LLM.
version: 1.1.0
homepage: https://github.com/developerashkan/rehoboam_neural_ui
repository: https://github.com/developerashkan/rehoboam_neural_ui
issue_tracker: https://github.com/developerashkan/rehoboam_neural_ui/issues
topics:
  - ai
  - llm
  - chat
  - ui
  - animation
screenshots:
  - description: 'Liquid glass assistant orbs'
    path: assets/screenshots/liquid_orb.png
  - description: 'AI assistant with tools and generated UI'
    path: assets/screenshots/assistant_dark.png
  - description: 'Rehoboam HUD flown to Tokyo by the model'
    path: assets/screenshots/hud_earth_dark.png
  - description: 'Every neural widget in the liquid design'
    path: assets/screenshots/gallery_dark.png
  - description: 'Animated tour of the neural widgets'
    path: assets/screenshots/hero.gif

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  dot_globe: ^0.2.0
  http: ^1.4.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  shaders:
    - shaders/liquid_orb.frag
    - shaders/liquid_wave.frag
    - shaders/edge_glow.frag
    - shaders/liquid_glass.frag
